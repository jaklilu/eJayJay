[build]
  publish = "dist"
  command = "bash scripts/build.sh"

[[redirects]]
  from = "/expenses"
  to = "/personal/expenses/"
  status = 301

[[redirects]]
  from = "/p/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[edge_functions]]
  function = "personal-gate"
  path = "/personal/*"
